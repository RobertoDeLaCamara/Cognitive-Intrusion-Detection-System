# docker-compose.sandbox.yml — CNDS Network Sandbox
#
# Simulates a home network with real packet capture, AdGuard Home DNS
# enforcement (Guardian auto-response), and a full detection pipeline.
#
# Usage:
#   docker compose -f docker-compose.sandbox.yml up --build
#   docker compose -f docker-compose.sandbox.yml up --build --profile attack
#
# Networks:
#   homenet  (172.28.0.0/24) — simulated LAN, traffic captured by detector
#   backend  (internal)      — DB, API, dashboard (not captured)

services:

  # ─── Infrastructure ──────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: sandbox-postgres
    environment:
      POSTGRES_USER: cnds
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sandbox_secret}
      POSTGRES_DB: cnds
    volumes:
      - sandbox_pgdata:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cnds -d cnds"]
      interval: 3s
      timeout: 2s
      retries: 15
      start_period: 3s
    mem_limit: 256m
    restart: unless-stopped

  # ─── AdGuard Home — DNS + Guardian enforcement backend ───────────────────────

  adguard:
    # Pinned by digest (was :latest, 2026-10-18). Bump deliberately: docker pull adguard/adguardhome:latest
    # then docker inspect --format '{{index .RepoDigests 0}}' adguard/adguardhome:latest
    image: adguard/adguardhome@sha256:aba9e3bf0613be3ba3755e1fc311b126e2c24bec25e18b6483894a88283074f0
    container_name: sandbox-adguard
    volumes:
      - ./sandbox/net/adguard/work:/opt/adguardhome/work
      - ./sandbox/net/adguard/conf:/opt/adguardhome/conf
    networks:
      homenet:
        ipv4_address: 172.28.0.2
      # Also on backend so the API (Guardian) can reach it
      backend: {}
    # Web UI on host:3000 for inspection; DNS on 53 within homenet
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    mem_limit: 128m
    restart: unless-stopped

  # ─── CNDS Core ───────────────────────────────────────────────────────────────

  api:
    build:
      context: .
      target: base
    container_name: sandbox-api
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    env_file:
      - path: .env.sandbox
        required: true
    environment:
      DATABASE_URL: postgresql+asyncpg://cnds:${POSTGRES_PASSWORD:-sandbox_secret}@postgres:5432/cnds
      # API runs Guardian — needs to reach AdGuard via backend network
      ADGUARD_URL: http://adguard:3000
      # The sandbox runs unauthenticated on purpose
      AUTH_DISABLED: "true"
    networks:
      - backend
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
    depends_on:
      postgres:
        condition: service_healthy
      adguard:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s
    mem_limit: 512m
    restart: unless-stopped

  detector:
    build:
      context: .
      target: base
    container_name: sandbox-detector
    user: root
    # Capture on the homenet interface (eth0 inside the container)
    command: python main.py --iface eth0
    env_file:
      - path: .env.sandbox
        required: true
    environment:
      DATABASE_URL: postgresql+asyncpg://cnds:${POSTGRES_PASSWORD:-sandbox_secret}@postgres:5432/cnds
      # Detector captures traffic; Guardian runs in the API process
      GUARDIAN_ENABLED: "false"
      # Lower thresholds for demo — fire alerts faster
      MIN_PACKETS_FOR_ML: "3"
      ENSEMBLE_THRESHOLD: "0.40"
      FLOW_TIMEOUT: "30"
      ICMP_FLOOD_THRESHOLD: "20"
      PORT_SCAN_THRESHOLD: "10"
      ALERT_COOLDOWN_SECS: "15"
    # Raw capture needs root, so keep root but drop every capability except the two it uses.
    # (A non-root user does not work: Docker's cap_add does not make capabilities effective
    # for uid != 0.)
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    networks:
      homenet:
        ipv4_address: 172.28.0.3
      backend: {}
    volumes:
      - ./models:/app/models:ro
    depends_on:
      api:
        condition: service_healthy
      adguard:
        condition: service_healthy
    mem_limit: 1.5g
    cpus: 2.0
    restart: unless-stopped

  dashboard:
    build:
      context: .
      target: dashboard
    container_name: sandbox-dashboard
    environment:
      CNDS_API_URL: http://api:8000
    networks:
      - backend
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 384m
    restart: unless-stopped

  # ─── Traffic Generators (simulated home devices) ─────────────────────────────

  # Simulates a laptop: web browsing, DNS queries, SSH
  client-laptop:
    build:
      context: ./sandbox/net
      dockerfile: Dockerfile.client
    container_name: sandbox-client-laptop
    environment:
      CLIENT_ROLE: laptop
      DNS_SERVER: 172.28.0.2
      TARGETS: "172.28.0.2,172.28.0.3,172.28.0.11,172.28.0.12"
    networks:
      homenet:
        ipv4_address: 172.28.0.10
    dns:
      - 172.28.0.2
    depends_on:
      adguard:
        condition: service_healthy
      detector:
        condition: service_started
    restart: unless-stopped

  # Simulates a phone: DNS + HTTPS mainly
  client-phone:
    build:
      context: ./sandbox/net
      dockerfile: Dockerfile.client
    container_name: sandbox-client-phone
    environment:
      CLIENT_ROLE: phone
      DNS_SERVER: 172.28.0.2
      TARGETS: "172.28.0.2,172.28.0.10,172.28.0.12"
    networks:
      homenet:
        ipv4_address: 172.28.0.11
    dns:
      - 172.28.0.2
    depends_on:
      adguard:
        condition: service_healthy
      detector:
        condition: service_started
    restart: unless-stopped

  # Simulates a smart TV: periodic DNS + streaming (high bandwidth UDP)
  client-tv:
    build:
      context: ./sandbox/net
      dockerfile: Dockerfile.client
    container_name: sandbox-client-tv
    environment:
      CLIENT_ROLE: smart-tv
      DNS_SERVER: 172.28.0.2
      TARGETS: "172.28.0.2,172.28.0.10,172.28.0.11"
    networks:
      homenet:
        ipv4_address: 172.28.0.12
    dns:
      - 172.28.0.2
    depends_on:
      adguard:
        condition: service_healthy
      detector:
        condition: service_started
    restart: unless-stopped

  # ─── Attacker (profile: attack) ─────────────────────────────────────────────

  attacker:
    build:
      context: ./sandbox/net
      dockerfile: Dockerfile.attacker
    container_name: sandbox-attacker
    environment:
      TARGETS: "172.28.0.10,172.28.0.11,172.28.0.12,172.28.0.2,172.28.0.3"
      ATTACK_DELAY: "30"
    networks:
      homenet:
        ipv4_address: 172.28.0.66
    dns:
      - 172.28.0.2
    cap_add:
      - NET_ADMIN
      - NET_RAW
    depends_on:
      detector:
        condition: service_started
    profiles:
      - attack
    restart: unless-stopped

# ─── Networks ──────────────────────────────────────────────────────────────────

networks:
  homenet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1
  backend:
    internal: true

# ─── Volumes ───────────────────────────────────────────────────────────────────

volumes:
  sandbox_pgdata:
