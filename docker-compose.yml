services:

  api:
    build:
      context: .
      target: base
    container_name: cnds-api
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - cnds_db:/app/data
    env_file:
      - path: .env
        required: false
      - path: .env.example
        required: false
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/cnds.db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s
    restart: unless-stopped

  detector:
    build:
      context: .
      target: base
    container_name: cnds-detector
    # Root required for raw packet capture
    user: root
    command: python main.py
    network_mode: host
    volumes:
      - ./models:/app/models:ro
    env_file:
      - path: .env
        required: false
      - path: .env.example
        required: false
    # NOTE: network_mode: host means container DNS won't resolve service
    # names. The detector writes directly to the DB, not via the API.
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    build:
      context: .
      target: dashboard
    container_name: cnds-dashboard
    ports:
      - "8501:8501"
    environment:
      - CNDS_API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # One-shot service: generates demo models (if missing) + runs synthetic
  # attack traffic so the dashboard has data immediately.
  demo-seed:
    build:
      context: .
      target: base
    container_name: cnds-demo-seed
    entrypoint: ["python", "scripts/demo_seed.py"]
    volumes:
      - ./models:/app/models
    env_file:
      - path: .env
        required: false
      - path: .env.example
        required: false
    depends_on:
      api:
        condition: service_healthy
    restart: "no"
    profiles:
      - demo

volumes:
  cnds_db:
