services:

  postgres:
    image: postgres:16-alpine
    container_name: cnds-postgres
    # Published to the host so cnds-detector (network_mode: host) can reach
    # it via localhost:5432 — it cannot resolve the "postgres" service name.
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=cnds
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env — no insecure default}
      - POSTGRES_DB=cnds
    volumes:
      - cnds_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cnds -d cnds"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    mem_limit: 256m
    cpus: 0.5
    restart: unless-stopped

  api:
    build:
      context: .
      target: base
    container_name: cnds-api
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
    env_file:
      # Compose applies later files as overrides, so defaults must load
      # first — otherwise .env.example's blank values clobber .env.
      - path: .env.example
        required: false
      - path: .env
        required: false
    environment:
      # api runs on the default bridge network: reachable via service name
      - DATABASE_URL=postgresql+asyncpg://cnds:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env — no insecure default}@postgres:5432/cnds
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped

  detector:
    build:
      context: .
      target: base
    container_name: cnds-detector
    # Root required for raw packet capture
    user: root
    command: python main.py
    network_mode: host
    volumes:
      - ./models:/app/models:ro
    env_file:
      # Compose applies later files as overrides, so defaults must load
      # first — otherwise .env.example's blank values clobber .env.
      - path: .env.example
        required: false
      - path: .env
        required: false
    environment:
      # host network mode: "postgres" is not resolvable, "localhost" is the
      # host itself, and postgres's port is published there.
      - DATABASE_URL=postgresql+asyncpg://cnds:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env — no insecure default}@localhost:5432/cnds
    # NOTE: network_mode: host means container DNS won't resolve service
    # names. The detector writes directly to the DB, not via the API.
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
    mem_limit: 1.5g
    cpus: 2.0
    restart: unless-stopped

  dashboard:
    build:
      context: .
      target: dashboard
    container_name: cnds-dashboard
    ports:
      - "8501:8501"
    environment:
      - CNDS_API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 384m
    cpus: 0.5
    restart: unless-stopped
    profiles:
      - dashboard

  # One-shot service: generates demo models (if missing) + runs synthetic
  # attack traffic so the dashboard has data immediately.
  demo-seed:
    build:
      context: .
      target: base
    container_name: cnds-demo-seed
    entrypoint: ["python", "scripts/demo_seed.py"]
    volumes:
      - ./models:/app/models
    env_file:
      # Compose applies later files as overrides, so defaults must load
      # first — otherwise .env.example's blank values clobber .env.
      - path: .env.example
        required: false
      - path: .env
        required: false
    depends_on:
      api:
        condition: service_healthy
    restart: "no"
    profiles:
      - demo

volumes:
  cnds_pgdata:
