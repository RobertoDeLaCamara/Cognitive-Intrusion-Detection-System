# Logstash pipeline for ingesting CNDS alerts.
#
# Option A: Poll the CNDS REST API
# Option B: Receive webhook pushes via HTTP input
#
# Usage: logstash -f siem/elastic/logstash_cnds.conf

input {
  # Option A: Poll CNDS API every 60s
  http_poller {
    urls => {
      cnds => {
        method => get
        url => "http://localhost:8000/api/alerts/export?format=json&hours=1"
        headers => {
          Accept => "application/json"
        }
      }
    }
    schedule => { cron => "* * * * *" }
    codec => "json"
    tags => ["cnds", "poll"]
  }

  # Option B: Receive webhook pushes from CNDS
  http {
    port => 5140
    codec => "json"
    tags => ["cnds", "webhook"]
  }
}

filter {
  # Parse timestamp
  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
  }

  # Normalize GeoIP for Kibana maps
  if [src_geo][latitude] and [src_geo][longitude] {
    mutate {
      add_field => {
        "[src_geo][location][lat]" => "%{[src_geo][latitude]}"
        "[src_geo][location][lon]" => "%{[src_geo][longitude]}"
      }
    }
    mutate {
      convert => {
        "[src_geo][location][lat]" => "float"
        "[src_geo][location][lon]" => "float"
      }
    }
  }

  # Add ECS fields for compatibility
  mutate {
    add_field => {
      "[event][kind]" => "alert"
      "[event][module]" => "cnds"
      "[event][category]" => "intrusion_detection"
    }
    rename => {
      "src_ip" => "[source][ip]"
      "dst_ip" => "[destination][ip]"
      "src_port" => "[source][port]"
      "dst_port" => "[destination][port]"
    }
  }
}

output {
  elasticsearch {
    hosts => ["https://localhost:9200"]
    index => "cnds-alerts-%{+YYYY.MM.dd}"
    user => "elastic"
    password => "${ES_PASSWORD}"
    ssl_certificate_verification => true
  }
}
