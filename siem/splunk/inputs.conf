# Splunk HTTP Event Collector (HEC) input configuration for CNDS alerts.
#
# 1. Enable HEC in Splunk: Settings → Data Inputs → HTTP Event Collector
# 2. Create a new token with this sourcetype
# 3. Set WEBHOOK_URLS in .env to: https://<splunk>:8088/services/collector/event
#    with header: Authorization: Splunk <your-hec-token>

[cnds_alerts]
disabled = false
index = main
sourcetype = cnds:alert
token = <your-hec-token>
