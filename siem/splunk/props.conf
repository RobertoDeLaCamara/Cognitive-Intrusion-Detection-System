# Splunk props.conf — field extraction for CNDS alerts
#
# Place in $SPLUNK_HOME/etc/apps/cnds/local/props.conf

[cnds:alert]
TIME_FORMAT = %Y-%m-%dT%H:%M:%S.%6N%z
TIME_PREFIX = "timestamp"\s*:\s*"
MAX_TIMESTAMP_LOOKAHEAD = 40
SHOULD_LINEMERGE = false
KV_MODE = json
TRUNCATE = 65536

# Field aliases for CIM compliance (Network Traffic data model)
FIELDALIAS-src = src_ip AS src
FIELDALIAS-dest = dst_ip AS dest
FIELDALIAS-src_port = src_port AS src_port
FIELDALIAS-dest_port = dst_port AS dest_port
FIELDALIAS-severity = severity AS severity
FIELDALIAS-signature = attack_type AS signature

# Calculated fields
EVAL-vendor_product = "CNDS"
EVAL-action = if(acknowledged=="true", "allowed", "blocked")
EVAL-ids_type = "network"
