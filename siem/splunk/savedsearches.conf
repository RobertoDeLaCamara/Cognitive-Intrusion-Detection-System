# Splunk saved searches for CNDS alerts
#
# Place in $SPLUNK_HOME/etc/apps/cnds/local/savedsearches.conf

[CNDS - High Severity Alerts (Last 24h)]
search = sourcetype="cnds:alert" (severity="high" OR severity="critical") | table timestamp src_ip dst_ip attack_type severity ensemble_score triggered_rules ja3_hash mitre_techniques | sort -timestamp
dispatch.earliest_time = -24h
dispatch.latest_time = now
is_scheduled = 1
cron_schedule = 0 * * * *
alert.severity = 4
alert_type = number of events
alert_comparator = greater than
alert_threshold = 0

[CNDS - Top Attacking IPs]
search = sourcetype="cnds:alert" severity!="low" | stats count dc(attack_type) AS attack_types values(attack_type) AS types latest(timestamp) AS last_seen by src_ip | sort -count | head 20
dispatch.earliest_time = -24h
dispatch.latest_time = now

[CNDS - MITRE ATT&CK Coverage]
search = sourcetype="cnds:alert" mitre_techniques!="" | spath input=mitre_techniques output=techniques | mvexpand techniques | spath input=techniques | stats count by id name tactic | sort -count
dispatch.earliest_time = -7d
dispatch.latest_time = now

[CNDS - Suspicious JA3 Fingerprints]
search = sourcetype="cnds:alert" ja3_hash!="" | stats count values(src_ip) AS sources values(attack_type) AS attack_types by ja3_hash | sort -count
dispatch.earliest_time = -24h
dispatch.latest_time = now
